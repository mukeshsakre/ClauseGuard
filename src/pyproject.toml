[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clauseguard"
version = "0.1.0"
description = "Tenant-isolated contract policy compliance and agentic retrieval service."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.35,<2",
  "celery>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "neo4j>=5.27,<6",
  "openai>=1.60,<3",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pypdf>=5.1,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.12,<2",
  "redis>=5,<7",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools]
# Keep the published import name stable while the implementation follows the
# repository layout directly under packages/core.
packages = [
  "clauseguard_core",
  "clauseguard_core.application",
  "clauseguard_core.domain",
  "clauseguard_core.ingestion",
  "clauseguard_core.infrastructure",
  "clauseguard_api",
  "clauseguard_worker",
]

[tool.setuptools.package-dir]
clauseguard_core = "packages/core"
"clauseguard_core.application" = "packages/core/application"
"clauseguard_core.domain" = "packages/core/domain"
"clauseguard_core.ingestion" = "packages/core/ingestion"
"clauseguard_core.infrastructure" = "packages/core/infrastructure"
clauseguard_api = "app/api/clauseguard_api"
clauseguard_worker = "app/worker/clauseguard_worker"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core", "app/api", "app/worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501","I001"]
