services:
  postgres:
    image: postgres:17-alpine
    container_name: clauseguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clauseguard}
      POSTGRES_USER: ${POSTGRES_USER:-clauseguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in src/deploy/.env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - clauseguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clauseguard} -d ${POSTGRES_DB:-clauseguard}"]
      interval: 5s
      timeout: 3s
      retries: 20

# Qdrant, RabbitMQ, and Redis remain externally managed as requested.
volumes:
  clauseguard-postgres-data:
